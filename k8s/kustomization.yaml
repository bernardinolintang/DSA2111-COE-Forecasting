# Apply everything with:  microk8s kubectl apply -k k8s/
# (scripts/ronin/deploy.sh does this for you, after building and pushing the images)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# this namespace is unique per group because the Ronin VM (and its microk8s) is shared by the class
# so that we do not clash with other groups
namespace: coe-g7

# this lists every manifest so that one command applies them all
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ml.yaml

# images are pushed to microk8s' built-in registry (Week 5 lab) so that the cluster can pull them
# locally
images:
  - name: coe-api
    newName: localhost:32000/coe-api
    newTag: v1
  - name: coe-web
    newName: localhost:32000/coe-web
    newTag: v1
  - name: coe-ml
    newName: localhost:32000/coe-ml
    newTag: v1

# this labels every object so that the whole project can be selected at once
labels:
  - pairs:
      project: coe-forecast
