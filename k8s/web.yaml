# nginx front end (static app + reverse proxy to coe-api), exposed on a NodePort.
# On Ronin, reach it through an SSH tunnel:  ssh -L 8080:localhost:30080 <user>@<host>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coe-web
  labels: { app: coe-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: coe-web }
  template:
    metadata:
      labels: { app: coe-web }
    spec:
      containers:
        - name: web
          image: coe-web            # rewritten to the registry image by kustomization.yaml
          ports:
            - containerPort: 80
          env:
            - name: API_UPSTREAM
              value: coe-api:8000
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: coe-web
spec:
  type: NodePort
  selector: { app: coe-web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080               # change if another group already uses it
