# PostgreSQL with a persistent volume. One replica: a database is stateful, so
# it is not scaled like the stateless API / web pods.
# this asks for 1Gi of disk so that data survives a pod restart
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coe-db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coe-db
  labels: { app: coe-db }
spec:
  replicas: 1
  strategy:
    type: Recreate                 # never run two Postgres pods on the same volume
  selector:
    matchLabels: { app: coe-db }
  template:
    metadata:
      labels: { app: coe-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          # these set the database name and password so that they match what the API and ML job use
          env:
            - name: POSTGRES_DB
              value: coe
            - name: POSTGRES_USER
              value: coe
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: coe-db, key: password }
            # this puts the data in a subfolder so that postgres does not fail on the volume's root
            # folder
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # this checks postgres is ready so that the API only connects to a working database
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "coe", "-d", "coe"]
            initialDelaySeconds: 5
            periodSeconds: 5
          # this restarts a stuck database so that it can heal itself
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "coe", "-d", "coe"]
            initialDelaySeconds: 30
            periodSeconds: 15
          # these set CPU and memory limits so that one pod cannot use up the shared VM
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coe-db-data
---
# this gives the database a stable name so that the API and ML job can find it
apiVersion: v1
kind: Service
metadata:
  name: coe-db
spec:
  selector: { app: coe-db }
  ports:
    - port: 5432
      targetPort: 5432
