# Local / single-VM deployment of the whole stack.
#
#   docker compose up --build        # db + ml (runs once) + api + web
#   open http://localhost:8080
#
#   docker compose run --rm ml run --skip-backtest   # quick retrain after a new bidding exercise
#   docker compose run --rm api pytest -q tests      # API tests against the live database
name: coe-forecast

# this is the shared database address so that ml and api always point to the same place
x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coe}:${POSTGRES_PASSWORD:-coe_password}@db:5432/${POSTGRES_DB:-coe}

services:
  # this is postgres with a named volume so that data survives restarts
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coe}
      POSTGRES_USER: ${POSTGRES_USER:-coe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coe_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # this runs the schema on first start so that the tables exist before the app connects
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # this checks postgres is ready so that the other services wait for it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # this is the batch job: ingest -> backtest -> train -> forecast -> write to Postgres, then exit,
  # so that it never runs as a long-lived service
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    image: coe-ml:latest
    environment:
      <<: *database-url
      DATAGOV_API_KEY: ${DATAGOV_API_KEY:-}
      COE_WORKERS: ${COE_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # this is the REST API so that the web app can read forecasts
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: coe-api:latest
    environment:
      <<: *database-url
      WAIT_THRESHOLD: ${WAIT_THRESHOLD:-0.08}
      # COE Analyst: put GROQ_API_KEY (or ANTHROPIC_API_KEY) in .env so that it uses a model,
      # without a key it runs in basic mode
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANALYST_ENABLED: ${ANALYST_ENABLED:-true}      # false = basic mode (deterministic; used for e2e runs)
      ANALYST_PROVIDER: ${ANALYST_PROVIDER:-}
      ANALYST_MODEL: ${ANALYST_MODEL:-}
      ANALYST_EFFORT: ${ANALYST_EFFORT:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # this is nginx with the static site so that port 8080 serves the whole app
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: coe-web:latest
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

# this names the database volume so that compose keeps it between runs
volumes:
  pgdata:
