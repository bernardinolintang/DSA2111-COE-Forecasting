<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f4f1"/><text x="150" y="60" font-family="Arial, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#292b2d" text-anchor="start">How often the real price landed inside our 80% range</text><text x="150" y="100" font-family="Arial, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#6b6f72" text-anchor="start">Target is 80%. Above it = too cautious, below it = overconfident.</text><line x1="150" x2="1540" y1="740" y2="740" stroke="#292b2d" stroke-width="2.5"/><text x="136" y="750" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">0%</text><line x1="150" x2="1540" y1="622" y2="622" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="632" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">20%</text><line x1="150" x2="1540" y1="504" y2="504" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="514" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">40%</text><line x1="150" x2="1540" y1="386" y2="386" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="396" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">60%</text><line x1="150" x2="1540" y1="268" y2="268" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="278" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">80%</text><line x1="150" x2="1540" y1="150" y2="150" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="160" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">100%</text><text transform="translate(40 445) rotate(-90)" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" fill="#6b6f72" text-anchor