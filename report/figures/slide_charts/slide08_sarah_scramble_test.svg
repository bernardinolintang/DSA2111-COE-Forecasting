<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f4f1"/><text x="150" y="60" font-family="Arial, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#292b2d" text-anchor="start">Did scrambling the future change earlier forecasts?</text><text x="150" y="100" font-family="Arial, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#6b6f72" text-anchor="start">Later data was scrambled, then every model was re-run.</text><line x1="150" x2="1540" y1="740" y2="740" stroke="#292b2d" stroke-width="2.5"/><text x="136" y="750" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">0%</text><line x1="150" x2="1540" y1="592.5" y2="592.5" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="602.5" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">25%</text><line x1="150" x2="1540" y1="445" y2="445" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="455" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">50%</text><line x1="150" x2="1540" y1="297.5" y2="297.5" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="307.5" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">75%</text><line x1="150" x2="1540" y1="150" y2="150" stroke="#d9d5ce" stroke-width="1.5"/><text x="136" y="160" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6b6f72" text-anchor="end">100%</text><text transform="translate(40 445) rotate(-90)" font-family="Arial, 'Segoe UI', sans-serif" font-size="24" fill="#6b6f72" text-anchor="middle">% of forecasts that changed</text><rect x="422.5" y="740" width="150" height="3" rx="6" fill="#2e7d4f"/><text x="497.5" y="726" font-family="Arial, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#292b2d" text-anchor="middle">0%  (0 of 1,260)</text><text x="497.5" y="788" font-family="Arial, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#292b2d" text-anchor="middle">Forecasts made BEFORE the cut-off</text><rect x="1117.5" y="150" width="150" height="590" rx="6" fill="#b3412f"/><text x="1192.5" y="136" font-family="Arial, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#292b2d" text-anchor="middle">100%  (900 of 900)</text><text x="1192.5" y="788" font-family="Arial, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#292b2d" text-anchor="middle">Forecasts made AFTER the cut-off</text></svg>